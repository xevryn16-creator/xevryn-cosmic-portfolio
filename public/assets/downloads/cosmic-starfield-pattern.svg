<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="nebulaSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05050a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep space base -->
  <rect width="400" height="400" fill="#070913" />

  <!-- Soft Nebula Cloud -->
  <circle cx="200" cy="180" r="160" fill="url(#nebulaSoft)" />

  <!-- Constellation Nodes & Connecting Lines -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" fill="none">
    <line x1="50" y1="80" x2="110" y2="60" />
    <line x1="110" y1="60" x2="160" y2="120" />
    <line x1="160" y1="120" x2="220" y2="90" />
    <line x1="220" y1="90" x2="310" y2="130" />
    <line x1="160" y1="120" x2="140" y2="210" />
    <line x1="140" y1="210" x2="210" y2="260" />
    <line x1="210" y1="260" x2="280" y2="240" />
    <line x1="280" y1="240" x2="350" y2="300" />
  </g>

  <!-- Bright Major Stars -->
  <circle cx="50" cy="80" r="2.5" fill="#f8fafc" />
  <circle cx="110" cy="60" r="3.2" fill="#38bdf8" />
  <circle cx="160" cy="120" r="4.0" fill="#f8fafc" />
  <circle cx="220" cy="90" r="2.8" fill="#c084fc" />
  <circle cx="310" cy="130" r="3.5" fill="#fde047" />
  <circle cx="140" cy="210" r="2.8" fill="#38bdf8" />
  <circle cx="210" cy="260" r="3.8" fill="#f8fafc" />
  <circle cx="280" cy="240" r="2.4" fill="#38bdf8" />
  <circle cx="350" cy="300" r="3.2" fill="#c084fc" />

  <!-- Minor Distant Stars -->
  <circle cx="25" cy="190" r="1.2" fill="#cbd5e1" opacity="0.6" />
  <circle cx="80" cy="320" r="1.0" fill="#94a3b8" opacity="0.5" />
  <circle cx="70" cy="140" r="1.5" fill="#e2e8f0" opacity="0.7" />
  <circle cx="180" cy="40" r="1.0" fill="#94a3b8" opacity="0.4" />
  <circle cx="260" cy="45" r="1.5" fill="#cbd5e1" opacity="0.6" />
  <circle cx="360" cy="70" r="1.2" fill="#e2e8f0" opacity="0.5" />
  <circle cx="330" cy="210" r="1.4" fill="#cbd5e1" opacity="0.7" />
  <circle cx="240" cy="340" r="1.2" fill="#94a3b8" opacity="0.5" />
  <circle cx="170" cy="360" r="1.5" fill="#cbd5e1" opacity="0.6" />
  <circle cx="370" cy="370" r="1.0" fill="#94a3b8" opacity="0.4" />
</svg>
